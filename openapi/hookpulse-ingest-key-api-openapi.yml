openapi: 3.2.0
info:
  title: HookPulse Ingest Key API
  version: 1d751aaf
  description: Monitor scheduled tasks and receive alerts for missing check-ins. Read GET /api/ for the API index.
servers:
- url: https://hookpulse.net
tags:
- name: Ingest Key
paths:
  /api/ingest-key:
    get:
      operationId: ingest_key
      summary: Returns (minting it the first time) the key that lets a ping create its own…
      description: 'One key per owner. Point a whole fleet at `/in//` and each job creates its monitor on the first check-in, **inside the free tier** — beyond it the ping answers 402 without creating anything. The key survives signing in: the crontab you deployed keeps working.

        Returns: { key, rotated, exemplo, note }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ key, rotated, exemplo, note }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: The ingest key, prefix `hpk_`.
                  rotated:
                    type: boolean
                    description: '`true` when this response came from a rotation.'
                  exemplo:
                    type: string
                    description: 'A ready URL: `<origin>/in/<key>/nightly-backup`.'
                  note:
                    type: string
                    description: What the slug means and what rotating does.
                required:
                - key
                - rotated
                - exemplo
                - note
        '401':
          description: No credential, or an invalid one. See this endpoint's auth.
      tags:
      - Ingest Key
    delete:
      operationId: ingest_key_rotate
      summary: 'Rotates the ingest key: the previous one stops creating monitors immediately'
      description: 'Monitors already created keep working — rotating only revokes the power to create new ones.

        Returns: { key, rotated, exemplo, note }'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: '{ key, rotated, exemplo, note }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                    description: The new key.
                  rotated:
                    type: boolean
                    description: Always `true` here.
                  exemplo:
                    type: string
                    description: A ready URL with the new key.
                  note:
                    type: string
                    description: What the slug means and what rotating does.
                required:
                - key
                - rotated
                - exemplo
                - note
        '401':
          description: No credential, or an invalid one. See this endpoint's auth.
      tags:
      - Ingest Key
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Guest token (`POST /api/guest`) in `X-Guest-Token: hp_…` or `Authorization: Bearer hp_…`. A signed-in account (cookie) also works and takes precedence.'
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - monitoring
  - cron
  - devops
  docs:
    homepage: https://hookpulse.net/
    apiReference: https://hookpulse.net/developers
    llms: https://hookpulse.net/llms.txt
