openapi: 3.2.0
info:
  title: HookPulse Partners API
  version: 1d751aaf
  description: Monitor scheduled tasks and receive alerts for missing check-ins. Read GET /api/ for the API index.
servers:
- url: https://hookpulse.net
tags:
- name: Partners
paths:
  /api/partners:
    get:
      operationId: get_api_partners
      summary: 'Partnership, sponsorship and advertising: the product''s placements with a…'
      description: 'Information on request, no activation: placements from the house catalogue priced in USD per 30 days (90 and 365 days discounted), sponsors in effect, an excerpt of `/api/vitrine`, the house wallet (USDC on Base) and the contact path — bank deposit, PIX or invoice are arranged in the reply. Cached for 1 hour.

        Returns: { status, produto, idioma, titulo, descricao, publico, modalidades, placements, house_bundle, parcerias, current_sponsors, stats, payment, contact, politica, _links }'
      security: []
      responses:
        '200':
          description: '{ status, produto, idioma, titulo, descricao, publico, modalidades, placements, house_bundle, parcerias, current_sponsors, stats, payment, contact, politica, _links }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: '`sob_consulta`: information and proposal, no activation and no charge.'
                  produto:
                    type: string
                    description: Product name.
                  idioma:
                    type: string
                    description: Language of the texts (the product's).
                  titulo:
                    type: string
                    description: Title of the offer.
                  descricao:
                    type: string
                    description: One sentence about the offer.
                  publico:
                    type: string
                    description: Who uses the product — the audience a sponsor reaches.
                  modalidades:
                    type: array
                    items:
                      type: object
                    description: '`{ id, nome }`: patrocinio, parceria, anuncio.'
                  placements:
                    type: array
                    items:
                      type: object
                    description: 'The product''s placements: `id`, `nome`, `onde`, `formato`, `exclusivo`, `medicao`, `price_usd_30d` (suggested; `null` is on request), `exposure[{ dias, price_usd }]` for 30, 90 and 365 days, `disponivel`.'
                  house_bundle:
                    type: object
                    description: 'The house bundle: footer and agent mention across the ten products, discounted.'
                  parcerias:
                    type: array
                    items:
                      type: string
                    description: Partnership ideas the product is open to discuss.
                  current_sponsors:
                    type: array
                    items:
                      type: object
                    description: 'Sponsors in effect: `id`, `nome`, `url`, `frase`, `espacos`, `ate`.'
                  stats:
                    type: object
                    description: 'Excerpt of the public numbers (`hoje`, `janelas`, `agentes`, `confiabilidade`) and the `link` to `/api/vitrine`; `publicado: false` before the first publication.'
                  payment:
                    type: object
                    description: 'How to pay: `rede`, `chain_id`, `ativo`, `pay_to`, `eip681` (the house wallet, when declared), `alternativas` and the `nota` — bank deposit, PIX or invoice in the reply.'
                  contact:
                    type: object
                    description: '`email`, `form_url`, `api_url` (`POST /api/contact`, free: one message every 10 s per network), `campos` (required), `campos_proposta` (the optional proposal fields, each with its accepted values), `message_template`, `instructions`.'
                  politica:
                    type: object
                    description: Placement label, refused sectors, prepayment, deadlines.
                  _links:
                    type: object
                    description: '`self`, `stats`, `page` (`null` until the page exists), `contact`, `casa` (the same path on the ten products).'
                required:
                - status
                - produto
                - idioma
                - titulo
                - descricao
                - publico
                - modalidades
                - placements
                - house_bundle
                - parcerias
                - current_sponsors
                - stats
                - payment
                - contact
                - politica
                - _links
      tags:
      - Partners
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Guest token (`POST /api/guest`) in `X-Guest-Token: hp_…` or `Authorization: Bearer hp_…`. A signed-in account (cookie) also works and takes precedence.'
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
x-service-info:
  categories:
  - monitoring
  - cron
  - devops
  docs:
    homepage: https://hookpulse.net/
    apiReference: https://hookpulse.net/developers
    llms: https://hookpulse.net/llms.txt
