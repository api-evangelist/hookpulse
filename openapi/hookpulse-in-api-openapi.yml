openapi: 3.2.0
info:
  title: HookPulse In API
  version: 1d751aaf
  description: Monitor scheduled tasks and receive alerts for missing check-ins. Read GET /api/ for the API index.
servers:
- url: https://hookpulse.net
tags:
- name: In
paths:
  /in/{ingestKey}/{slug}:
    get:
      operationId: ping_slug
      summary: Ping that CREATES its own monitor on the first hit — a whole fleet with no setup
      description: 'The slug becomes the monitor name and its identity: the same slug always means the same monitor, so a retry never creates a second one. Normalised to lowercase, `[a-z0-9-]`, 40 chars. Creation happens **only inside the free tier** (or the trial); past it the ping is a 402 with `accepts[]` and nothing is written — not even the event. Works by GET or POST.

        Returns: { ok, endpoint_id, created }'
      security: []
      parameters:
      - name: ingestKey
        in: path
        required: true
        schema:
          type: string
          enum:
          - hpk_exemplo
        description: Ingest key, from `GET /api/ingest-key`.
        example: $INGEST_KEY
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Name of the job; it becomes the monitor name.
        example: nightly-backup
      - name: interval
        in: query
        required: false
        schema:
          type: integer
        description: Tolerated silence of the monitor being created, in seconds.
      - name: cron
        in: query
        required: false
        schema:
          type: string
        description: 'Five-field cron of the job, for the monitor being created: late counts from the scheduled time plus `grace_sec`, not from an interval. Takes the place of `interval`.'
      - name: tz
        in: query
        required: false
        schema:
          type: string
        description: IANA time zone the `cron` is read in. Default `UTC`. Only with `cron`.
      - name: grace_sec
        in: query
        required: false
        schema:
          type: integer
        description: Tolerance after the scheduled time, 30 to 86400 seconds; default 90. Only with `cron`.
      responses:
        '200':
          description: '{ ok, endpoint_id, created }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the ping was recorded.
                  endpoint_id:
                    type: string
                    description: The monitor's id — new or the one that already existed.
                  created:
                    type: boolean
                    description: '`true` only on the hit that created it.'
                required:
                - ok
                - endpoint_id
                - created
        '400':
          description: '`slug_invalido` — nothing usable left after normalising. With `cron`: `cron_invalido`, `tz_invalida`, `grace_invalido` or `cron_sem_ocorrencia`.'
        '402':
          description: 'The free tier is full: pay and repeat, or delete a monitor.'
        '404':
          description: Unknown or rotated ingest key.
      tags:
      - In
  /in/{ingestKey}/{slug}/{signal}:
    get:
      operationId: signal_slug
      summary: 'A signal by name: `start`, `fail` or the exit code, for the monitor of that slug'
      description: 'The same signals as `/in/:id/start`, `/in/:id/fail` and `/in/:id/:exit_code`, for a fleet that only knows the ingest key: the job sends its name, not the monitor id. The first signal of a new name creates the monitor, with the same rules and the same `cron`, `tz` and `grace_sec` as the plain ping by name.

        Returns: { ok, endpoint_id, created }'
      security: []
      parameters:
      - name: ingestKey
        in: path
        required: true
        schema:
          type: string
          enum:
          - hpk_exemplo
        description: Ingest key, from `GET /api/ingest-key`.
        example: $INGEST_KEY
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Name of the job; it becomes the monitor name.
        example: nightly-backup
      - name: signal
        in: path
        required: true
        schema:
          type: string
          enum:
          - fail
        description: '`start`, `fail`, or the shell exit code 0 to 255 (0 is success).'
        example: $
      responses:
        '200':
          description: '{ ok, endpoint_id, created }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the signal was recorded.
                  endpoint_id:
                    type: string
                    description: The monitor's id — new or the one that already existed.
                  created:
                    type: boolean
                    description: '`true` only on the hit that created it.'
                required:
                - ok
                - endpoint_id
                - created
        '400':
          description: '`slug_invalido`, `exit_code_fora_da_faixa`, or a `cron` code as in the plain ping by name.'
        '402':
          description: 'The free tier is full: pay and repeat, or delete a monitor.'
        '404':
          description: Unknown or rotated ingest key, or an unknown signal.
      tags:
      - In
  /in/{id}:
    get:
      operationId: ping_ingest
      summary: 'The ingest URL: this is where your cron or webhook proves it is alive'
      description: 'No credential on purpose — the caller is a cron, and the ID is already the secret. It costs nothing and there is no quota per ping.

        Returns: { ok }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Monitor ID, from `Monitor.ingest_url`.
        example: ID
      responses:
        '200':
          description: '{ ok }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the ping was recorded.
                required:
                - ok
        '404':
          description: The monitor does not exist or is deactivated.
      tags:
      - In
    post:
      operationId: post_in_by_id
      summary: The same ingest by POST, for whoever can only send webhooks
      description: 'The body is optional and records `status` and `latency_ms` along with the ping.

        Returns: { ok }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Monitor ID, from `Monitor.ingest_url`.
        example: ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: Status of the job that is pinging, to show in `Ping.status`.
                latency_ms:
                  type: integer
                  description: How long the job took, in ms.
            example:
              status: 200
              latency_ms: 431
      responses:
        '200':
          description: '{ ok }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the ping was recorded.
                required:
                - ok
        '404':
          description: The monitor does not exist or is deactivated.
      tags:
      - In
  /in/{id}/start:
    get:
      operationId: signal_start
      summary: Says the routine STARTED — it is what turns silence into duration
      description: '`start` is not proof of life: it does not move `last_event_at` and does not clear the miss counter, so a routine that starts and hangs still becomes a miss at the right time. The next success closes the run and records `last_duration_ms` — pass `?rid=` on both ends when runs can overlap, or the duration is measured against the wrong start. With `max_duration_sec` set on the monitor, a run left open past that ceiling alerts with `reason: "too_long"` on the next 5-minute check. Works by GET or POST.

        Returns: { ok, kind }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Monitor ID, from `Monitor.ingest_url`.
        example: ID
      - name: rid
        in: query
        required: false
        schema:
          type: string
        description: 'Run identifier that pairs this start with the check-in that closes it. `[A-Za-z0-9._-]`, up to 64 characters. Send it when two runs of the same routine can overlap — without it the second start replaces the first, and the duration we report belongs to the wrong run. A value that does not pass the rule is ignored, never rejected: refusing a check-in would turn a live routine into a miss.'
      responses:
        '200':
          description: '{ ok, kind }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the signal was recorded.
                  kind:
                    type: string
                    description: 'The signal recorded: `start`.'
                required:
                - ok
                - kind
        '404':
          description: The monitor does not exist or is deactivated.
      tags:
      - In
  /in/{id}/fail:
    get:
      operationId: signal_fail
      summary: Says the routine FAILED — the alert leaves on the next 5-minute check
      description: 'Failing is not proof of life either: the clock keeps running. The ingest never sends e-mail and never calls out — it records `alert_pending` and the cron turns it into an alert with `reason: "fail"` within 5 minutes, under the same one-per-24h cap. Works by GET or POST.

        Returns: { ok, kind }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Monitor ID, from `Monitor.ingest_url`.
        example: ID
      - name: rid
        in: query
        required: false
        schema:
          type: string
        description: The `rid` of the run this closes. It only measures — and only clears the open run — when it matches the `rid` that opened it; a different one leaves the open run alone, so a concurrent run is not cut short. Sending none closes whatever is open.
      responses:
        '200':
          description: '{ ok, kind }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the signal was recorded.
                  kind:
                    type: string
                    description: 'The signal recorded: `fail`.'
                required:
                - ok
                - kind
        '404':
          description: The monitor does not exist or is deactivated.
      tags:
      - In
  /in/{id}/{exit_code}:
    get:
      operationId: signal_exit_code
      summary: 'The shell''s exit status, straight from `$?`: 0 is success, anything else is a…'
      description: '`curl -fsS $ORIGIN/in/ID/$?` at the end of a script is the whole integration. `0` behaves exactly like a plain ping; 1 to 255 record the code and leave the failure for the cron.

        Returns: { ok, kind }'
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Monitor ID, from `Monitor.ingest_url`.
        example: $ID
      - name: exit_code
        in: path
        required: true
        schema:
          type: string
        description: Exit status, 0 to 255. Outside that range it is a 400.
        example: $
      - name: rid
        in: query
        required: false
        schema:
          type: string
        description: The `rid` of the run this closes. It only measures — and only clears the open run — when it matches the `rid` that opened it; a different one leaves the open run alone, so a concurrent run is not cut short. Sending none closes whatever is open.
      responses:
        '200':
          description: '{ ok, kind }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: Always `true` when the signal was recorded.
                  kind:
                    type: string
                    description: '`ping` for 0, `fail` for anything else.'
                required:
                - ok
                - kind
        '400':
          description: '`exit_code_fora_da_faixa` — the exit status must be 0 to 255.'
        '404':
          description: The monitor does not exist or is deactivated.
      tags:
      - In
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Guest token (`POST /api/guest`) in `X-Guest-Token: hp_…` or `Authorization: Bearer hp_…`. A signed-in account (cookie) also works and takes precedence.'
    globalAccount:
      type: apiKey
      in: cookie
      name: __Host-mm-auth
      description: Global session in the product's HttpOnly cookie; writes require exact Origin and X-CSRF-Token.
    contaChaveApi:
      type: http
      scheme: bearer
      bearerFormat: mmk_…
      description: 'Account API key: `Authorization: Bearer mmk_…` or `X-Api-Key: mmk_…`. Created on the account page (API keys), valid only in the product where it was created; it acts as the account (or the organization that owns it).'
    carteiraAgente:
      type: http
      scheme: bearer
      bearerFormat: mmw_…
      description: 'Wallet credential of an agent without an account (`Authorization: Bearer mmw_…`, 30 days, this product only): POST /api/auth/wallet/agent/start, sign the message with the wallet, POST /api/auth/wallet/agent/token. The owner is `x402:<address>`.'
