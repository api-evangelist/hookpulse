notes: 'Live, anonymous hosted MCP server probed 2026-09-05: initialize and tools/list both answered 200
  with 14 tools carrying real inputSchemas (saved verbatim to mcp/hookpulse-mcp-tools.json). A GET on
  the endpoint returns a server card. Every tool is a thin wrapper over the public REST API on the same
  host; credentials (X-Guest-Token, Authorization, X-PAYMENT) are forwarded from headers. Paid tool actions
  surface x402: over-quota calls return a 402 payload with accepts[]. The provider also publishes its
  MCP registry verification key at /.well-known/mcp-registry-auth (ed25519), and the homepage carries
  Cursor/VS Code MCP install deeplinks.'
